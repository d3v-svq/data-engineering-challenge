# Extracted from reference docker compose file: https://github.com/openlakestream/kafka/blob/4.3-ursa/docker/examples/docker-compose-files/cluster/ursa/docker-compose.yml

# The single Compose stack for Kafka with diskless Ursa storage.
#
#   docker compose up -d                              # oxia, minio, minio-init, kafka-1
#   docker compose --profile only-streaming up -d     # + schema-registry
#   docker compose --profile e2e up -d                # + polaris, polaris-setup, schema-registry
#
# The default stack is the core cluster, which needs only the Kafka image. The
# `e2e` profile adds the compaction/Iceberg services (and the locally
# built compactor image).

---
name: kafka-ursa

x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093"
  KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  # KRaft metadata lives on the data volume. A container recreate must not drop
  # the metadata log, or the next producer re-creates its topics as classic ones.
  KAFKA_LOG_DIRS: "/var/lib/kafka/data/kraft-combined-logs"
  KAFKA_SOCKET_SERVER_ENABLE_REQUEST_PIPELINING: "true"

  # Diskless storage and the two protocol-level Lakestream/Oxia endpoints.
  KAFKA_URSA_STORAGE_ENABLE: "true"
  KAFKA_URSA_CATALOG_OXIA_SERVICE_URL: "oxia://oxia:6648/default"
  KAFKA_URSA_OXIA_SERVICE_URL: "oxia://oxia:6648/default"
  KAFKA_URSA_STORAGE_BACKEND_TYPE: "S3"
  # For remote backends `ursa.storage.path` is the object prefix, not a local path.
  KAFKA_URSA_STORAGE_PATH: "ursa/wal"
  KAFKA_URSA_STORAGE_S3_ENDPOINT: "http://minio:9000"
  KAFKA_URSA_STORAGE_S3_ACCESS_KEY: "minioadmin"
  KAFKA_URSA_STORAGE_S3_SECRET_KEY: "minioadmin"
  KAFKA_URSA_STORAGE_S3_BUCKET: "kafka-ursa"
  KAFKA_URSA_STORAGE_S3_REGION: "us-east-1"
  KAFKA_URSA_STORAGE_S3_PATH_STYLE_ACCESS: "true"
  KAFKA_URSA_STORAGE_COMPACTION_BUCKET: "kafka-ursa"
  KAFKA_URSA_STORAGE_COMPACTION_PREFIX: "ursa/compacted"

  # The WAL write buffer flushes on whichever comes first, the interval or the
  # size. The interval is the produce-latency floor, so these are the general
  # purpose values; `run-lakehouse-demo.sh` lowers both to shorten its loop.
  KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: "${URSA_WRITE_BUFFER_FLUSH_INTERVAL_MS:-250}"
  KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_SIZE: "${URSA_WRITE_BUFFER_FLUSH_SIZE:-268435456}"
  KAFKA_URSA_STORAGE_WRITE_BUFFER_SIZE: "16777216" # 16 MiB (default is 4 MiB)

x-kafka-service: &kafka-service
  image: ${IMAGE:-lakestream/kafka:latest}
  restart: unless-stopped
  depends_on:
    oxia:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1
    interval: 5s
    timeout: 30s
    retries: 30
    start_period: 60s

# One-shot workload containers share the broker image for its CLI tools.
x-kafka-cli: &kafka-cli
  image: ${IMAGE:-lakestream/kafka:latest}
  restart: "no"

services:
  oxia:
    image: ${OXIA_IMAGE:-oxia/oxia:0.16.7}
    hostname: oxia
    command: ["standalone", "--data-dir=/data", "--shards=8"]
    entrypoint: ["/oxia/bin/oxia"]
    ports:
      - "6648:6648"
    volumes:
      - oxia-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/metrics || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: rustfs/rustfs:latest
    hostname: minio
    #command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_ROOT_USER: minioadmin
      RUSTFS_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://minio:9000 s3 mb s3://kafka-ursa || true
        aws --endpoint-url http://minio:9000 s3 mb s3://lakehouse || true

  polaris:
    image: ${POLARIS_IMAGE:-apache/polaris:1.7.0}
    profiles: ["e2e"]
    hostname: polaris
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "18181:8181"
      - "18182:8182"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."ALLOW_SETTING_S3_ENDPOINTS": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
      # The stack intentionally uses Polaris' test-only in-memory metastore and
      # an HTTP MinIO endpoint. Permit those dev-only readiness exceptions.
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 15s

  polaris-setup:
    image: ${CURL_IMAGE:-alpine/curl:8.21.0}
    profiles: ["e2e"]
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      POLARIS_CLIENT_ID: root
      POLARIS_CLIENT_SECRET: s3cr3t
      POLARIS_REALM: POLARIS
      POLARIS_CATALOG_NAME: ursa
      POLARIS_OAUTH2_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      POLARIS_MANAGEMENT_URI: http://polaris:8181/api/management
      POLARIS_WAREHOUSE: s3://lakehouse/warehouse
      POLARIS_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
    volumes:
      - ./lakehouse/polaris-setup.sh:/opt/ursa-demo/polaris-setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/ursa-demo/polaris-setup.sh"]

  # Schema registry: Karapace (Apache 2.0) implements the Confluent Schema
  # Registry REST API, so the compactor's Confluent client, the Confluent
  # serializers and any other registry-aware tooling work against it unchanged.
  # Schemas live in a classic `_schemas` topic on the same brokers. The
  # compactor resolves each topic's `<topic>-value` subject to turn Avro, JSON
  # Schema, or Protobuf records into typed Iceberg columns; the registry is not
  # on the broker read path. Karapace retries until the brokers are up, so it
  # only needs them started, not healthy.
  schema-registry:
    image: ${KARAPACE_IMAGE:-ghcr.io/aiven-open/karapace:6.2.2}
    profiles: ["e2e", "only-streaming"]
    hostname: schema-registry
    restart: unless-stopped
    depends_on:
      - kafka-1
    ports:
      - "18081:8081"
    # The image has no entrypoint; this module is the schema registry.
    entrypoint: ["python3", "-m", "karapace"]
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_KARAPACE_REST: "false"
      KARAPACE_BOOTSTRAP_URI: kafka-1:19092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: "8081"
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_CLIENT_ID: schema-registry
      KARAPACE_GROUP_ID: schema-registry
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_REPLICATION_FACTOR: "1"
      KARAPACE_COMPATIBILITY: BACKWARD
      KARAPACE_LOG_LEVEL: INFO
    healthcheck:
      # `/_health` answers 200 as soon as `_schemas` exists; registrations also
      # need the reader caught up and this node elected primary, so gate on both.
      test:
        - CMD-SHELL
        - >-
          health="$$(curl -sf http://localhost:8081/_health)" &&
          echo "$$health" | grep -Eq '"schema_registry_ready": ?true' &&
          echo "$$health" | grep -Eq '"schema_registry_is_primary": ?true'
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s


  # Part of the core stack, not the `lakehouse` profile: without compaction the
  # WAL delete watermark never advances, so Kafka retention frees no storage.
  # `lakehouse` adds Polaris and, with URSA_MATERIALIZATION_ENABLED=true, the
  # external Iceberg table on top of the compacted objects Kafka already reads.
  compactor:
    image: ${IMAGE:-lakestream/kafka:latest}
    profiles: ["e2e"]
    hostname: compactor
    restart: unless-stopped
    depends_on:
      oxia:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      polaris-setup:
        condition: service_completed_successfully
        required: false
      schema-registry:
        condition: service_healthy
        required: false
    environment:
      OTEL_SDK_DISABLED: "true"
      URSA_MATERIALIZATION_ENABLED: "${URSA_MATERIALIZATION_ENABLED:-false}"
      # Read by the entrypoint only when materialization is on.
      URSA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      URSA_METADATA_STORE_URL: oxia://oxia:6648/default
      URSA_OXIA_STORAGE_URL: oxia://oxia:6648/default
      URSA_WAL_BUCKET: kafka-ursa
      URSA_WAL_PREFIX: ursa/wal
      URSA_COMPACTION_BUCKET: kafka-ursa
      URSA_COMPACTION_PREFIX: ursa/compacted
      URSA_S3_ENDPOINT: http://minio:9000
      POLARIS_CATALOG_NAME: ursa
      POLARIS_CATALOG_URI: http://polaris:8181/api/catalog
      POLARIS_OAUTH2_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      POLARIS_CLIENT_ID: root
      POLARIS_CLIENT_SECRET: s3cr3t
    volumes:
      - ./lakehouse/compactor-entrypoint.sh:/opt/ursa-demo/compactor-entrypoint.sh:ro
      - ./lakehouse/log4j2.properties:/opt/ursa-demo/log4j2.properties:ro
    entrypoint: ["/bin/sh", "/opt/ursa-demo/compactor-entrypoint.sh"]

  kafka-1:
    <<: *kafka-service
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_LISTENERS_HOST:-localhost}:29092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data


  # ---------------------------------------------------------------------------
  # Profile: e2e - on-demand SQL shell against the local Polaris catalog.
  # ---------------------------------------------------------------------------
  duckdb:
    image: ${DUCKDB_IMAGE:-duckdb/duckdb:1.5.5}
    profiles: ["e2e"]
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
        required: false
    stdin_open: true
    tty: true
    volumes:
      - ./lakehouse/duckdb-init.sql:/opt/ursa-demo/duckdb-init.sql:ro
      - duckdb-extensions:/root/.duckdb
    entrypoint: ["/duckdb", "-init", "/opt/ursa-demo/duckdb-init.sql"]

volumes:
  oxia-data:
  minio-data:
  kafka-1-data:
  duckdb-extensions: