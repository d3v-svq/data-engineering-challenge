[package]
name = "ocpp_kafka_producer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
rdkafka = { version = "0.34", features = ["cmake-build"] }
schema_registry_converter = { version = "3.1", features = ["avro", "easy"] }
apache-avro = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
chrono = "0.4"