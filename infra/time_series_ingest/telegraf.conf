[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""

# -------------------------------------------------------------------------
# INPUT: KAFKA CONSUMER
# -------------------------------------------------------------------------
[[inputs.kafka_consumer]]
  kafka_version = "4.3.0"
  brokers = ["$KAFKA_BROKER"]
  topics = ["$KAFKA_TOPIC"]
  consumer_group = "telegraf_ocpp_cg"
  offset = "oldest"

  # Define connection to Schema Registry
  data_format = "avro"
  avro_format = "binary"
  avro_schema_registry = "$SCHEMA_REGISTRY"

  # Map Avro payload to InfluxDB schema
  avro_measurement = "ocpp_operational_metrics"

  # Tags (Indexed strings, used for filtering/grouping)
  avro_tags = ["stationId", "location", "metric", "unit"]

  # Fields (Unindexed floats/ints/strings, the actual values to aggregate)
  avro_fields = ["value"]

  # NOTE: avro_timestamp (event_ts) is deliberately omitted due to it have values from the past,
  # so we can build a demo as it was in "real-time".
  # Telegraf will automatically assign the current server processing time as the InfluxDB timestamp.

# -------------------------------------------------------------------------
# OUTPUT: INFLUXDB V2 OSS
# -------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["$INFLUX_URL"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"